AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NW Mineral Monitor - static map site on S3 + CloudFront, with a nightly
  Lambda that refreshes BLM mining-claim snapshots (active daily; closed
  monthly in three batches).

Parameters:
  ProjectName:
    Type: String
    Default: nw-mineral-monitor
    AllowedPattern: '[a-z0-9-]+'
    Description: Lowercase name used to tag/derive resource names.
  AlertEmailFrom:
    Type: String
    Default: ''
    Description: >-
      SES-verified sender for expiration-watch digests (empty = email off).
      Verify the address in SES first — see RUNBOOK.md step 6.
  AlertEmailTo:
    Type: String
    Default: ''
    Description: Comma-separated recipient list for watch digests (empty = email off).
  AlertWebhookUrl:
    Type: String
    Default: ''
    Description: Optional webhook POSTed the alert digest JSON (empty = off).
  WatchBbox:
    Type: String
    Default: '-114.2867,41.9882,-113.0,42.6878'
    Description: >-
      Legacy-only AOI bbox (x0,y0,x1,y1). Scheduled expiration watches use
      the exact 19 registry claim states and never this compatibility bbox.

  EnableLegacyDocumentStore:
    Type: String
    Default: 'true'
    AllowedValues: [ 'true', 'false' ]
    Description: >-
      Serve the presigned-PDF citation viewer corpus. Enabled by default now
      that the builder refuses to store a row without an affirmative
      public-domain basis, so every stored document already carries the
      evidence the canonical WS12 harvester/document index requires. Set
      false to withhold the viewer and its corpus from a deployment.

  Ws13RetrievalFunction:
    Type: String
    Default: ''
    AllowedPattern: '[a-zA-Z0-9_-]{0,64}'
    ConstraintDescription: >-
      A bare Lambda FUNCTION NAME, not an ARN. The retrieval stack outputs
      both; pasting the ARN renders AskRole's InvokeFunction resource as
      arn:aws:lambda:...:function:arn:aws:lambda:...:function:..., which no
      policy ever matches, so every invoke returns AccessDenied and the
      deployment runs permanently on the fallback while looking configured.
    Description: >-
      Name of the WS13 retrieval Lambda that queries the full 852,027-chunk
      corpus. Empty (the default) leaves ASK on the bounded SQLite index.
  Ws13RetrievalEnabled:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]
    Description: >-
      Route search_documents at Ws13RetrievalFunction. Shipped disabled so the
      query path deploys dark: the ANN index becomes a quality upgrade rather
      than something a release waits on.
  Ws13VectorArm:
    Type: String
    Default: ''
    AllowedValues: [ '', 'true', 'false' ]
    Description: >-
      Mirror of the retrieval stack's VectorArmEnabled. Set it to false while
      that stack ships the vector arm off and ASK stops paying for a Titan
      embedding it knows will be discarded. Empty (the default) makes ASK learn
      the arm state from each WS13 response instead, so a mismatched mirror
      costs at most one wasted embedding per container per recheck window.

Conditions:
  LegacyDocumentStoreEnabled: !Equals [ !Ref EnableLegacyDocumentStore, 'true' ]
  Ws13RetrievalConfigured: !Not [ !Equals [ !Ref Ws13RetrievalFunction, '' ] ]

Resources:

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      # The WS12 viewer fetches a stored PDF straight from S3 with a
      # presigned URL, so S3 — not CloudFront — answers that cross-origin
      # request. GET/HEAD only, and the signature is what authorizes it: a
      # wildcard origin grants nothing to a caller without a valid signature.
      # PDF.js reads byte ranges, so Range must be accepted and the range
      # response headers must be exposed.
      CorsConfiguration:
        CorsRules:
          - Id: ws12-presigned-document-reads
            AllowedMethods: [ GET, HEAD ]
            AllowedOrigins: [ '*' ]
            AllowedHeaders: [ range, if-match, if-none-match, if-modified-since ]
            ExposedHeaders: [ Accept-Ranges, Content-Length, Content-Range, ETag ]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # Raw originals are the provenance copy: read rarely, kept forever.
          # Searchable copies stay hot because every citation opens one.
          - Id: ws12-raw-originals-to-ia
            Status: Enabled
            Prefix: 'docs/'
            # S3's post-2024 default silently excludes objects below 128 KiB.
            # Some one-page mine records (including both IF0126 files) are
            # smaller, so opt this exact rule into all positive object sizes.
            ObjectSizeGreaterThan: '0'
            TagFilters:
              - Key: ws12-variant
                Value: raw
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ProjectName}-data-15min'
        DefaultTTL: 900
        MaxTTL: 3600
        MinTTL: 60
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref ProjectName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed policy "CachingOptimized"
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: 'data/*'
            TargetOriginId: site-s3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref DataCachePolicy

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            # Deliberately omit staging/, watch/, ckpt/, and docs/: raw
            # national snapshots, operational state, and the WS12 source
            # document corpus are not public web assets. docs/ in particular
            # must stay uncrawlable — it is served only by the short-TTL
            # presigned GETs the docs API mints for a signed-in caller.
            Resource:
              - !Sub '${SiteBucket.Arn}/index.html'
              - !Sub '${SiteBucket.Arn}/viewer.html'
              - !Sub '${SiteBucket.Arn}/model3d.html'
              # pregenerated 3-D models (pipelines/geomodel_autopopulate.py and the
              # minevis publisher): the map's DESCRIBED WORKINGS button fetches
              # models/<id>/model.geomodel.json through CloudFront
              - !Sub '${SiteBucket.Arn}/models/*'
              - !Sub '${SiteBucket.Arn}/auth.json'
              - !Sub '${SiteBucket.Arn}/assets/*'
              - !Sub '${SiteBucket.Arn}/data/*'
              - !Sub '${SiteBucket.Arn}/ws10-assets/*'
              - !Sub '${SiteBucket.Arn}/map-assets/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          # data/* contains ordinary public dashboard metadata, but the full
          # document catalog includes subjects and verbatim citation text.
          # Keep that exact source-of-truth manifest behind the authenticated
          # Docs API even if an operator accidentally uploads the old key.
          - Sid: DenyCloudFrontDocumentManifest
            Effect: Deny
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/data/docs/manifest.json'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  UpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: s3-data-rw
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject, s3:PutObject ]
                Resource:
                  - !Sub '${SiteBucket.Arn}/data/*'
                  - !Sub '${SiteBucket.Arn}/staging/claims/*'
              # checkpoint files for the resumable pulls (crash fix 2026-08-06)
              - Effect: Allow
                Action: [ s3:GetObject, s3:PutObject, s3:DeleteObject ]
                Resource: !Sub '${SiteBucket.Arn}/ckpt/*'
              # self-continuation: a pull that runs low on time re-invokes itself
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-claims-updater'
              # ListBucket is what makes a MISSING object return 404 rather
              # than 403, and this role's control flow is built on that
              # distinction. lock_read() and ckpt_load() in lambda_updater.py
              # treat NoSuchKey/404/NotFound as "no lock yet" and re-raise
              # anything else; without s3:ListBucket, S3 answers a GetObject
              # for a key that does not exist with AccessDenied, so the first
              # lock read of every run raised before a lock could ever be
              # acquired. That is the whole of the 2026-08-21 outage: 102
              # consecutive failures, 8-16 a day, one per scheduled state*mode.
              #
              # Do NOT "fix" this by treating AccessDenied as missing.
              # test_lambda_updater.py pins the opposite, and rightly: a real
              # denial read as an absent lock puts two chains on one
              # checkpoint and doubles the BLM load the lock exists to stop.
              #
              # Deliberately carries no s3:prefix condition. A GetObject
              # request supplies no prefix, so the implicit existence check
              # cannot satisfy one, and any condition here would leave the
              # 403 in place -- a scoped grant that reads as tighter while
              # restoring nothing.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn

  UpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-claims-updater'
      Runtime: python3.12
      # Every function here has always run x86_64 by CloudFormation default.
      # Declaring it keeps a later arm64 edit from silently breaking a
      # manylinux wheel in an uploaded deployment package.
      Architectures: [ x86_64 ]
      Handler: index.handler
      # 512 OOM-killed the NV pull (275k geometries in flight) and starved the
      # CPU — memory scales CPU/network on Lambda, so 2048 also parses ~4× faster
      MemorySize: 2048
      Timeout: 900
      Role: !GetAtt UpdaterRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          # Statewide JSON is never browser-published. Keep the updater's
          # compatibility escape hatch explicitly empty in production.
          LEGACY_JSON_STATES: ''
      Code:
        ZipFile: |
          def handler(event, context):
              return {"note": "placeholder - upload infra/lambda_updater.py "
                              "(deploy.sh step 3, or paste it in the Lambda "
                              "console code editor as index.py and Deploy)"}

  NightlyActiveRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-nightly-active'
      Description: Stage active federal claims for WA, OR, ID, MT, and WY (09:10 UTC)
      ScheduleExpression: cron(10 9 * * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"active","states":["WA","OR","ID","MT","WY"]}'

  NightlyActiveNvUtRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-nightly-active-nv'
      Description: Refresh active-claim snapshot, NV (09:40 UTC — largest claim population, runs alone)
      ScheduleExpression: cron(40 9 * * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"active","states":["NV"]}'

  NightlyActiveP1Rule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-nightly-active-p1'
      Description: Stage P1 federal claims for UT, AZ, CO, NM, AK
      ScheduleExpression: cron(40 10 * * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"active","states":["UT","AZ","CO","NM","AK"]}'

  NightlyActiveP2Rule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-nightly-active-p2'
      Description: Stage thin-population P2 federal claim states
      ScheduleExpression: cron(10 11 * * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"active","states":["AR","FL","LA","MS","NE","ND","SD"]}'

  MonthlyClosedRule1:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-1'
      Description: Refresh closed-claim snapshots for WA+OR (1st of month)
      ScheduleExpression: cron(0 10 1 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["WA","OR"]}'

  MonthlyClosedRule2:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-2'
      Description: Refresh closed-claim snapshots for ID+MT (1st of month)
      ScheduleExpression: cron(30 10 1 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["ID","MT"]}'

  MonthlyClosedRule3:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-3'
      Description: Refresh closed-claim snapshots for WY (1st of month)
      ScheduleExpression: cron(0 11 1 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["WY"]}'

  MonthlyClosedRule4:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-4'
      Description: Refresh complete closed-claim snapshot for NV (2nd of month; resumable paging to exhaustion)
      ScheduleExpression: cron(0 10 2 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["NV"]}'

  NightlyActiveCaRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-nightly-active-ca'
      Description: Refresh active-claim snapshot, CA (10:10 UTC — big state, runs alone; chains as needed)
      ScheduleExpression: cron(10 10 * * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"active","states":["CA"]}'

  MonthlyClosedRule6:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-6'
      Description: Refresh complete closed-claim snapshot for CA (3rd of month; resumable paging to exhaustion)
      ScheduleExpression: cron(0 10 3 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["CA"]}'

  MonthlyClosedRule5:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-5'
      Description: Refresh complete closed-claim snapshot for UT (2nd of month; resumable paging to exhaustion)
      ScheduleExpression: cron(0 11 2 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["UT"]}'

  MonthlyClosedP1Rule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-p1'
      Description: Stage P1 closed federal claims for AZ, CO, NM, AK
      ScheduleExpression: cron(0 10 4 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["AZ","CO","NM","AK"]}'

  MonthlyClosedP2Rule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-p2'
      Description: Stage closed claims for thin-population P2 states
      ScheduleExpression: cron(0 10 5 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["AR","FL","LA","MS","NE","ND","SD"]}'

  PermNightly:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyActiveRule.Arn
  PermNightlyNvUt:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyActiveNvUtRule.Arn
  PermNightlyP1:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyActiveP1Rule.Arn
  PermNightlyP2:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyActiveP2Rule.Arn
  PermClosed1:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule1.Arn
  PermClosed2:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule2.Arn
  PermClosed3:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule3.Arn
  PermClosed4:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule4.Arn
  PermClosed5:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule5.Arn
  PermNightlyCa:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyActiveCaRule.Arn
  PermClosed6:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule6.Arn
  PermClosedP1:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedP1Rule.Arn
  PermClosedP2:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedP2Rule.Arn

  # ---------- WS2d expiration watch ----------
  WatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: watch-s3-ses
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject, s3:PutObject ]
                Resource:
                  - !Sub '${SiteBucket.Arn}/data/*'
                  - !Sub '${SiteBucket.Arn}/watch/*'
              - Effect: Allow
                Action: [ s3:DeleteObject ]
                Resource: !Sub '${SiteBucket.Arn}/watch/*'
              - Effect: Allow
                Action: [ ses:SendEmail ]
                Resource: '*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-expiration-watch'

  WatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-expiration-watch'
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: index.handler
      # National snapshots include NV's large active population. Memory also
      # scales Lambda CPU/network and matches the claims-updater hotfix.
      MemorySize: 2048
      Timeout: 900
      Role: !GetAtt WatchRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          LEGACY_AOI_BBOX: !Ref WatchBbox
          WATCH_CHAIN_MAX: '40'
          WATCH_TIME_RESERVE_MS: '150000'
          SES_FROM: !Ref AlertEmailFrom
          SES_TO: !Ref AlertEmailTo
          WEBHOOK_URL: !Ref AlertWebhookUrl
          SITE_URL: !Sub 'https://${Distribution.DomainName}'
      Code:
        ZipFile: |
          def handler(event, context):
              return {"note": "placeholder - deploy.sh uploads infra/watch_lambda.py"}

  WatchDailyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-watch-daily'
      Description: Daily complete MLRS disposition diff for all 19 registry claim states
      ScheduleExpression: cron(10 13 * * ? *)
      State: ENABLED
      Targets:
        - Id: watch
          Arn: !GetAtt WatchFunction.Arn
          Input: '{"mode":"daily","states":["NV","AZ","CO","UT","NM","AK","SD","ND","NE","AR","FL","LA","MS","CA","ID","MT","OR","WA","WY"]}'

  # Sept-1 maintenance-fee window: every 6 h from Aug 25 through Sep 10.
  # EventBridge cron can't span a month boundary in one expression — two rules.
  WatchSeasonalAugRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-watch-fee-window-aug'
      Description: Fee-window watch, every 6h Aug 25-31
      ScheduleExpression: cron(20 */6 25-31 8 ? *)
      State: ENABLED
      Targets:
        - Id: watch
          Arn: !GetAtt WatchFunction.Arn
          Input: '{"mode":"seasonal","states":["NV","AZ","CO","UT","NM","AK","SD","ND","NE","AR","FL","LA","MS","CA","ID","MT","OR","WA","WY"]}'

  WatchSeasonalSepRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-watch-fee-window-sep'
      Description: Fee-window watch, every 6h Sep 1-10
      ScheduleExpression: cron(20 */6 1-10 9 ? *)
      State: ENABLED
      Targets:
        - Id: watch
          Arn: !GetAtt WatchFunction.Arn
          Input: '{"mode":"seasonal","states":["NV","AZ","CO","UT","NM","AK","SD","ND","NE","AR","FL","LA","MS","CA","ID","MT","OR","WA","WY"]}'

  AkStateWatchDailyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-ak-state-watch-daily'
      Description: Independent AK DNR state-claim snapshot and deadline diff
      ScheduleExpression: cron(40 13 * * ? *)
      State: ENABLED
      Targets:
        - Id: ak-state-watch
          Arn: !GetAtt WatchFunction.Arn
          Input: '{"system":"alaska_state_claims","mode":"daily"}'

  AkStateWatchSeasonalRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-ak-state-watch-seasonal'
      Description: AK state rent/labor calendar during Aug-Nov deadline season
      # Leave a full hour after the daily state snapshot so both jobs never
      # contend for the one owner-safe AK DNR baseline.
      ScheduleExpression: cron(40 14 * 8-11 ? *)
      State: ENABLED
      Targets:
        - Id: ak-state-watch
          Arn: !GetAtt WatchFunction.Arn
          Input: '{"system":"alaska_state_claims","mode":"seasonal"}'

  PermWatchDaily:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WatchFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WatchDailyRule.Arn
  PermWatchAug:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WatchFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WatchSeasonalAugRule.Arn
  PermWatchSep:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WatchFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WatchSeasonalSepRule.Arn
  PermAkStateWatchDaily:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WatchFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AkStateWatchDailyRule.Arn
  PermAkStateWatchSeasonal:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WatchFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AkStateWatchSeasonalRule.Arn

  # ---------- AI Q&A (Bedrock relay) ----------
  AskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # foundation-model/* already covers amazon.titan-embed-text-v2:0,
              # which ASK invokes to embed a WS13 query (WS13 itself has no
              # egress), so that model needs no statement of its own.
              - Effect: Allow
                Action: [ bedrock:InvokeModel ]
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - Effect: Allow
                Action: [ s3:GetObject ]
                Resource:
                  - !Sub '${SiteBucket.Arn}/private/ws12/document-index.sqlite3'
                  - !Sub '${SiteBucket.Arn}/private/ws12/spatial.sqlite3'
              # One named retrieval function, never a wildcard. The parameter
              # is empty until that stack exists and an ARN ending in an empty
              # function name is malformed, so an unconfigured deploy grants
              # the derived default name — inert until something answers to it.
              - Effect: Allow
                Action: [ lambda:InvokeFunction ]
                Resource: !If
                  - Ws13RetrievalConfigured
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Ws13RetrievalFunction}'
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-ws13-query'

  AskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-ask'
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: index.handler
      # The first GIS request downloads and SHA-verifies the national spatial
      # store before API Gateway's 30-second integration timeout.
      MemorySize: 3008
      EphemeralStorage:
        Size: 10240
      Timeout: 60
      Role: !GetAtt AskRole.Arn
      Environment:
        Variables:
          # tried in order; first one that answers sticks. Override to force a model.
          # Verified against Bedrock model cards 2026-07: Opus 4.7 = best on Bedrock;
          # Nova 2 Lite = first-party floor that needs no Anthropic use-case form.
          MODEL_IDS: 'us.anthropic.claude-opus-4-7,us.anthropic.claude-sonnet-4-6,us.anthropic.claude-haiku-4-5-20251001-v1:0,us.amazon.nova-2-lite-v1:0'
          DOC_INDEX_BUCKET: !Ref SiteBucket
          DOC_INDEX_KEY: 'private/ws12/document-index.sqlite3'
          DOC_INDEX_MAX_BYTES: '3700000000'
          DOC_VECTOR_SEARCH: 'true'
          SPATIAL_DB_BUCKET: !Ref SiteBucket
          SPATIAL_DB_KEY: 'private/ws12/spatial.sqlite3'
          SPATIAL_DB_MAX_BYTES: '8000000000'
          ENABLE_LEGACY_DOC_STORE: !Ref EnableLegacyDocumentStore
          # Dark by default: search_documents keeps reading the bounded SQLite
          # index until an operator flips this deployment onto WS13.
          WS13_RETRIEVAL_FUNCTION: !Ref Ws13RetrievalFunction
          WS13_RETRIEVAL_ENABLED: !Ref Ws13RetrievalEnabled
          WS13_VECTOR_ARM: !Ref Ws13VectorArm
          # API Gateway cuts this request off at 30 s (AskIntegration below),
          # so the WS13 invoke gets a client deadline well inside that budget:
          # the SQLite fallback is only real if it still has time to run.
          WS13_INVOKE_TIMEOUT_S: '12'
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 501, "body": "placeholder - upload infra/ask_lambda.py"}

  # API Gateway HTTP API instead of a Function URL — some org guardrails (SCPs)
  # block anonymous lambda:InvokeFunctionUrl; API Gateway invokes are not affected.
  AskApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-ask-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [ '*' ]
        AllowMethods: [ POST, OPTIONS ]
        AllowHeaders: [ x-auth-token, content-type ]

  AskAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref AskApi
      AuthorizerType: JWT
      IdentitySource: [ '$request.header.x-auth-token' ]
      JwtConfiguration:
        Audience: [ !Ref UserPoolClient ]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
      Name: !Sub '${ProjectName}-ask-cognito-jwt'

  AskIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AskApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AskFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  AskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AskApi
      RouteKey: 'POST /ask'
      Target: !Sub 'integrations/${AskIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AskAuthorizer

  AskStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AskApi
      StageName: '$default'
      AutoDeploy: true

  AskApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AskFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AskApi}/*'

  # ---------- WS12 document store (citation → primary source) ----------
  DocsRole:
    Type: AWS::IAM::Role
    Condition: LegacyDocumentStoreEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: docs-read-and-sign
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only, and only the manifest plus the corpus it names.
              # A presigned URL can never grant more than this role holds.
              - Effect: Allow
                Action: [ s3:GetObject ]
                Resource:
                  - !Sub '${SiteBucket.Arn}/private/ws12/document-store-manifest.json'
                  - !Sub '${SiteBucket.Arn}/docs/*'
                  # The two shapes the WS13 resolver in infra/docs_lambda.py
                  # signs, and nothing else. An OCR'd document is served from
                  # its searchable copy; a born-digital one is served from the
                  # ORIGINAL, because its publisher text layer is already there
                  # and because admission_class is GENERATED ALWAYS AS
                  # (split_part(s3_key,'/',2)), so the ws12/{class}/ prefix is
                  # the rights signal a copy under ws13/ would lose.
                  # The three classes are named individually rather than as
                  # ws12/*: that prefix also holds ws12/deploy/
                  # document-index.sqlite3, a build artefact this role has no
                  # business reading. The searchable entry ends in the PDF so
                  # the sidecar.txt written beside it stays unsignable — it is
                  # extracted text, never a page image.
                  - !Sub '${SiteBucket.Arn}/ws13/searchable/*/*/searchable.pdf'
                  - !Sub '${SiteBucket.Arn}/ws12/originals/*.pdf'
                  - !Sub '${SiteBucket.Arn}/ws12/licensed-copies/*.pdf'
                  - !Sub '${SiteBucket.Arn}/ws12/research-copies/*.pdf'

  DocsFunction:
    Type: AWS::Lambda::Function
    Condition: LegacyDocumentStoreEnabled
    Properties:
      FunctionName: !Sub '${ProjectName}-docs'
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: index.handler
      # Signing is arithmetic; the only real work is holding the validated
      # manifest across warm invocations.
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt DocsRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          MANIFEST_KEY: 'private/ws12/document-store-manifest.json'
          SITE_URL: !Sub 'https://${Distribution.DomainName}'
          # Long enough to open a scanned bulletin on a phone at an outcrop,
          # short enough that a copied link is not a distribution channel.
          PRESIGN_TTL: '300'
          MANIFEST_TTL: '300'
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 501, "body": "placeholder - upload infra/docs_lambda.py"}

  # Same reasoning as AskApi: some org guardrails (SCPs) block anonymous
  # lambda:InvokeFunctionUrl, so this is an HTTP API, not a Function URL.
  DocsApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: LegacyDocumentStoreEnabled
    Properties:
      Name: !Sub '${ProjectName}-docs-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [ '*' ]
        AllowMethods: [ GET, OPTIONS ]
        AllowHeaders: [ x-auth-token, content-type ]

  DocsAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: LegacyDocumentStoreEnabled
    Properties:
      ApiId: !Ref DocsApi
      AuthorizerType: JWT
      IdentitySource: [ '$request.header.x-auth-token' ]
      JwtConfiguration:
        Audience: [ !Ref UserPoolClient ]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
      Name: !Sub '${ProjectName}-docs-cognito-jwt'

  DocsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: LegacyDocumentStoreEnabled
    Properties:
      ApiId: !Ref DocsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DocsFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  DocsRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: LegacyDocumentStoreEnabled
    Properties:
      ApiId: !Ref DocsApi
      RouteKey: 'GET /doc'
      Target: !Sub 'integrations/${DocsIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref DocsAuthorizer

  DocsStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: LegacyDocumentStoreEnabled
    Properties:
      ApiId: !Ref DocsApi
      StageName: '$default'
      AutoDeploy: true

  DocsApiPermission:
    Type: AWS::Lambda::Permission
    Condition: LegacyDocumentStoreEnabled
    Properties:
      FunctionName: !Ref DocsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DocsApi}/*'

  # ---------- Cognito login ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true      # no self-signup
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 24
      IdTokenValidity: 24
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  MapUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: codyClinger
      MessageAction: SUPPRESS   # no invite email; deploy.sh sets the permanent password

  MapUserSean:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: sean
      MessageAction: SUPPRESS

  MapUserRachel:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: rachel
      MessageAction: SUPPRESS

Outputs:
  SiteURL:
    Description: Your map's URL
    Value: !Sub 'https://${Distribution.DomainName}'
  BucketName:
    Description: Upload the site/ folder here
    Value: !Ref SiteBucket
  UpdaterFunctionName:
    Description: The claims-updater Lambda
    Value: !Ref UpdaterFunction
  UserPoolId:
    Description: Cognito user pool (manage users here)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id (goes in auth.json)
    Value: !Ref UserPoolClient
  DistributionId:
    Description: CloudFront distribution (for cache invalidations)
    Value: !Ref Distribution
  AskUrl:
    Description: AI answerer endpoint (goes in auth.json)
    Value: !Sub 'https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/ask'
  AskFunctionName:
    Description: The AI relay Lambda
    Value: !Ref AskFunction
  WatchFunctionName:
    Description: The expiration-watch Lambda
    Value: !Ref WatchFunction
  DocsUrl:
    Condition: LegacyDocumentStoreEnabled
    Description: Source-document endpoint (goes in auth.json)
    Value: !Sub 'https://${DocsApi}.execute-api.${AWS::Region}.amazonaws.com/doc'
  DocsFunctionName:
    Condition: LegacyDocumentStoreEnabled
    Description: The WS12 document presign Lambda
    Value: !Ref DocsFunction
