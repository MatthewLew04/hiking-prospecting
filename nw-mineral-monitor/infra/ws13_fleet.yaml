AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  WS13 OCR/embed worker fleet: an Auto Scaling Group of c7g.4xlarge nodes
  (8 worker processes each) consuming the SQS work queue, writing to the
  data-plane Postgres and ws13/ S3 prefix. A target-tracking policy holds
  the SQS backlog (visible AND in-flight) per in-service node at a target,
  which scales the group both out and in down to MinSize 0. A per-node agent
  owns the rest of the lifecycle: it drains through a termination lifecycle
  hook so a scale-in never kills a document mid-OCR, retires the node out of
  the group when the queue drains, and holds (rather than silently replaces)
  a node whose workers died. Three CloudWatch alarms (idle fleet, worker exit
  failures, non-empty dead-letter queue) are optional-SNS.
  Private nodes, SSM-managed only.

  FleetMode selects what the nodes run, so one group serves two passes rather
  than two 500-line templates drifting apart. 'ocr' is the default and is
  everything above, unchanged. 'confidence' runs
  pipelines/ws13_confidence_pass.py: no SQS at all, sharded on
  WS13_SHARD/WS13_SHARD_COUNT, writing only ws13_pages.confidence and
  ws13_pages.low_confidence. They are separate passes because their blast
  radius is not comparable -- a measurement cannot affect retrieval, while
  replacing OCR text re-chunks and re-embeds the document and invalidates its
  rows in ws13_chunks_titan_hnsw.

Parameters:
  BucketName: {Type: String}
  QueueUrl: {Type: String}
  QueueName: {Type: String, Default: ws13-ocr-work}
  DeadLetterQueueName: {Type: String, Default: ws13-ocr-dlq}
  DbSecretArn: {Type: String}
  DbEndpoint: {Type: String}
  WorkerSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  SubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  DesiredCapacity: {Type: Number, Default: 0}
  MaxSize: {Type: Number, Default: 40}
  FleetName:
    Type: String
    Default: ws13-workers
    Description: >-
      Auto Scaling group name. Named rather than generated because the node
      agent and the WorkerRole policy both have to refer to this group: the
      agent completes its own lifecycle action and terminates itself out of
      the group, and the policy scopes those calls to this group's ARN.
  InstanceType: {Type: String, Default: c7g.4xlarge}
  WorkersPerNode: {Type: Number, Default: 8}
  FleetMode:
    Type: String
    Default: ocr
    AllowedValues: [ocr, confidence]
    Description: >-
      What each node runs. 'ocr' launches WorkersPerNode ws13_worker.py
      processes long-polling the SQS work queue: today's fleet, unchanged.
      'confidence' launches WorkersPerNode ws13_confidence_pass.py processes,
      which take no SQS message at all -- they measure per-page tesseract
      confidence over the 323,059 ocr_queue pages whose ws13_pages.confidence
      is NULL in every one of the 760,059 rows today, because
      page_confidences() shelled a pdftoppm that is not on PATH in the
      ocrmypdf image and every render exited rc=127. Default 'ocr', so a
      deploy that does not name this parameter changes nothing.
  ConfidenceNodeSlots:
    Type: Number
    Default: 40
    MinValue: 1
    Description: >-
      confidence mode only: how many node-sized slots the pass is cut into.
      A node claims one slot and its WorkersPerNode processes take the
      WorkersPerNode consecutive shards inside it, so WS13_SHARD_COUNT is
      ConfidenceNodeSlots x WorkersPerNode (40 x 8 = 320 shards over 323,059
      pages). WorkersPerNode is the knob for shard width: the pass's own
      --plan table sizes 40 nodes at 640 shards, one per vCPU on a
      c7g.4xlarge, which is WorkersPerNode 16 rather than the 8 the OCR
      worker uses -- a measurement process runs two containers in series and
      is not the memory hog an ocrmypdf run is. Whatever the width, it must
      stay FIXED for the life of a run: every process divides by the same
      denominator, so a node that dies leaves one identifiable shard behind
      instead of renumbering every other node's work -- which is exactly what
      deriving it from the live group size would do. Keep
      DesiredCapacity <= this; a node that finds every slot claimed WAITS
      ClaimStaleSeconds + 300 s, re-attempting the claim, before retiring
      itself with --should-decrement-desired-capacity. It waits because a
      replacement for a hard-dead node arrives long before its predecessor's
      claim goes stale, and decrementing there removes the only capacity that
      could ever reclaim that node's shard.
  ClaimStaleSeconds:
    Type: Number
    Default: 1800
    MinValue: 300
    Description: >-
      confidence mode only: how long a shard claim may go unrefreshed before
      another node may take it over. The node agent re-puts its claim every
      300 s, so 1800 s is six missed refreshes: long enough that a slow node
      is never robbed of its shard, short enough that a hard-killed node's
      shard is picked up within half an hour rather than never.
  ConfidenceSweepDocs:
    Type: Number
    Default: 25
    MinValue: 1
    Description: >-
      confidence mode only: documents per invocation of the pass (--limit).
      The pass is swept repeatedly rather than run once -- a document cut
      short by its 3600 s deadline leaves pages behind, and the 1,407-page
      document needs three deadlines -- and the wrapper checks the drain file
      between sweeps. At the corpus mean of ~11 pages/document and the
      BATCHED seed of 1.6 s/page -- WS13_CONF_BATCH defaults to true and this
      template never sets it, so one container per document is what a default
      confidence deploy runs -- 25 documents is about 7 minutes, so a
      scale-in is honoured in about that long instead of after a whole shard.
      The 5-8 s/page figure quoted elsewhere is the per-page container shape
      (WS13_CONF_BATCH=false), which is ~4x slower and is NOT the default;
      sizing this parameter off it overstates the sweep by that factor and
      understates the per-sweep restart (a cached docker pull and one
      renderer probe) as a share of it.
  ConfidenceSweepMaxSeconds:
    Type: Number
    Default: 86400
    MinValue: 600
    Description: >-
      confidence mode only: total wall clock one process may spend sweeping
      before it gives up and reports failure. The pass returns 10 for "pages
      remain and this sweep measured some" and 11 for "pages remain and this
      sweep measured nothing"; the wrapper sweeps again on 10 and backs off
      geometrically on 11, giving up after CONF_MAX_STALLS. This ceiling is
      the last backstop under both, and under an exit 1 (an unhandled
      exception, which the pass never returns deliberately). It is NOT the
      first line of defence any more -- it used to be, because "work remains"
      WAS exit 1 and the wrapper could not tell it from a crash, so a wedged
      shard was only noticed here, 24 h later. 24 h is far past the projected
      run (323,059 pages at the batched 1.6 s/page seed over 320 shards is
      under half an hour) and short enough that anything the backoff misses
      still surfaces as a held node and an alarm within a day.
  BacklogPerInstanceTarget:
    Type: Number
    Default: 120
    Description: >-
      Target SQS messages (visible plus in flight) per in-service node. One
      node runs WorkersPerNode worker processes and a document averages
      minutes, so a backlog of ~15 documents per worker process is roughly an
      hour of queued work per node: enough to keep a node busy without
      holding capacity that the remaining backlog no longer justifies. The
      in-flight term adds at most WorkersPerNode per node, so it shifts the
      ratio by ~7% at this target and only matters at the tail, where it is
      the difference between "nothing left to do" and "every node is busy".
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: >-
      Optional SNS topic for the three alarms. Empty by default so the stack
      deploys in an account with no topic: the alarms still exist and still
      change state, they simply notify nobody.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
  # One condition, not two: every mode-dependent property below is written as
  # !If [IsOcrMode, <today's behaviour>, <confidence behaviour>], so the
  # default path is always the first branch and can be read off at a glance.
  IsOcrMode: !Equals [!Ref FleetMode, ocr]

Resources:
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: ws13-worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: s3:GetObject, Resource: !Sub 'arn:aws:s3:::${BucketName}/ws12/*'}
              - {Effect: Allow, Action: [s3:GetObject, s3:PutObject], Resource: !Sub 'arn:aws:s3:::${BucketName}/ws13/*'}
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${BucketName}
                Condition: {StringLike: {'s3:prefix': ['ws12/*', 'ws13/*']}}
              # Releasing a confidence shard claim is a DELETE, and delete is
              # the one S3 verb this role has never had. Scoped to the claim
              # keys alone rather than widened to ws13/*, which holds the
              # searchable PDFs and sidecars the corpus is built from.
              - Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${BucketName}/ws13/fleet/confidence/claims/*'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes, sqs:SendMessage]
                Resource:
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${QueueName}
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${DeadLetterQueueName}
              - {Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref DbSecretArn}
              # The node retires itself: it completes the drain lifecycle
              # action the group started, or terminates itself out of the
              # group WITH --should-decrement-desired-capacity. Without these
              # the only exit is `shutdown`, which the group reads as an
              # unhealthy instance and replaces, forever. The group ARN
              # carries a generated UUID that CloudFormation does not expose,
              # so the resource wildcards that segment only.
              - Effect: Allow
                Action:
                  - autoscaling:CompleteLifecycleAction
                  - autoscaling:RecordLifecycleActionHeartbeat
                  - autoscaling:TerminateInstanceInAutoScalingGroup
                Resource: !Sub
                  - 'arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${Name}'
                  - {Name: !Ref FleetName}
              # One metric, one namespace: whether this node's workers exited
              # cleanly or died. A bad bundle used to be invisible.
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition: {StringEquals: {'cloudwatch:namespace': WS13/Fleet}}
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.cohere.embed-v4:0
                  - arn:aws:bedrock:*::foundation-model/cohere.embed-v4:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0

  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref WorkerRole]}

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: ws13-worker
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        # The node's last resort when the autoscaling API is unavailable is
        # `shutdown -h now`. Without this the EC2 default applies, the
        # instance goes to `stopped` rather than `terminated`, the 200 GB gp3
        # volume below keeps billing (DeleteOnTermination does not fire on a
        # stop), and the group's EC2 health check replaces the node because
        # DesiredCapacity never changed -- a boot/stop/replace loop that
        # costs money silently. infra/ws13_runner.yaml and
        # infra/harvest_runner.yaml already set this; this template did not.
        InstanceInitiatedShutdownBehavior: terminate
        IamInstanceProfile: {Arn: !GetAtt WorkerProfile.Arn}
        SecurityGroupIds: [!Ref WorkerSecurityGroupId]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 200, VolumeType: gp3, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: instance
            Tags: [{Key: Name, Value: ws13-worker}, {Key: project, Value: nw-mineral-monitor}]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -x
            TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')
            export AWS_DEFAULT_REGION=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
            dnf install -y python3-pip python3-boto3 docker postgresql16 >> /var/log/ws13-setup.log 2>&1
            systemctl start docker
            for a in 1 2 3 4 5; do python3 -m pip install --quiet "psycopg[binary]" pypdf && break; sleep 20; done
            mkdir -p /opt/ws13/scratch /opt/ws13/var/ws12 && cd /opt/ws13
            for a in 1 2 3 4 5; do aws s3 cp s3://${BucketName}/ws13/fleet/bundle.tar.gz . && break; sleep 15; done
            tar xzf bundle.tar.gz
            PW=$(aws secretsmanager get-secret-value --secret-id ${DbSecretArn} --query SecretString --output text | python3 -c 'import json,sys;print(json.load(sys.stdin)["password"])')
            export WS13_BUCKET=${BucketName} WS13_QUEUE_URL=${QueueUrl}
            export WS13_DB_DSN="postgresql://nwmm:$PW@${DbEndpoint}:5432/nwmm?sslmode=require"
            # The only variable exported in BOTH modes. run_worker.sh and
            # node_agent.sh are written below as quoted heredocs, so they read
            # it at run time from the environment they inherit. Nothing else
            # reads WS13_MODE, so setting it to 'ocr' changes no process's
            # behaviour; every confidence-only variable is exported inside the
            # confidence branch alone, so an ocr node's environment is exactly
            # what it was.
            export WS13_MODE=${FleetMode}
            # Written in both modes and used in neither unless FleetMode is
            # confidence. It exists as a FILE rather than as a block inside
            # this script because the node agent claims slots too: when a node
            # finishes its own shard it looks for one nobody is measuring
            # before it gives its capacity back, and two copies of a claim
            # protocol are two protocols.
            cat > /opt/ws13/claim_slot.sh <<'CLAIMEOF'
            #!/bin/bash
            # usage: claim_slot.sh claim      -> prints a slot index, or rc 1
            #        claim_slot.sh incomplete -> how many slots are not
            #                                    marked state=complete
            #
            # A slot is a key under ws13/fleet/confidence/claims. PutObject
            # with If-None-Match '*' succeeds for exactly one caller per key,
            # so the first key a node wins is its slot and no two nodes can
            # win the same one. An unfinished claim that has gone
            # ClaimStaleSeconds without a refresh is taken over
            # unconditionally: two nodes can lose that race together and
            # measure one shard twice, which costs CPU and rewrites nothing
            # (the pass only fills rows where confidence IS NULL), while a
            # skipped shard is pages nothing measures and nothing reports.
            CLAIMS=ws13/fleet/confidence/claims
            LOG=/var/log/ws13-claim.log
            IID=$(cat /opt/ws13/claim 2>/dev/null)
            LAST=$(( ${ConfidenceNodeSlots} - 1 ))
            head_of() {
              aws s3api head-object --bucket ${BucketName} --key $CLAIMS/shard-"$1" --query '[LastModified, Metadata.state]' --output text 2>/dev/null
            }
            # cut, not `set -- $head`: that would overwrite this script's own
            # positional parameters as a side effect of reading a header.
            # Field 1 is LastModified, field 2 is the state ('None' when a
            # claim predates the metadata).
            state_of() { printf '%s' "$1" | cut -f2; }
            # The lmsec=0 fallback is the direction to fail in. If
            # LastModified ever fails to parse, epoch 0 makes the claim look
            # ancient and it is taken over, which at worst duplicates a shard.
            # The alternative -- an empty age, a comparison that errors, and a
            # claim silently left alone -- would leave a dead node's pages
            # unmeasured with nothing to show for it.
            age_of() {
              lm=$(printf '%s' "$1" | cut -f1)
              lmsec=$(date -d "$lm" +%s 2>/dev/null)
              [ -n "$lmsec" ] || lmsec=0
              echo $(( $(date +%s) - lmsec ))
            }
            case "$1" in
            claim)
              for i in $(seq 0 $LAST); do
                if aws s3api put-object --bucket ${BucketName} --key $CLAIMS/shard-$i --body /opt/ws13/claim --metadata state=running,node=$IID --if-none-match '*' >> $LOG 2>&1; then
                  echo "$i"; exit 0
                fi
              done
              for i in $(seq 0 $LAST); do
                head=$(head_of $i) || continue
                [ "$(state_of "$head")" = complete ] && continue
                age=$(age_of "$head")
                if [ "$age" -gt ${ClaimStaleSeconds} ]; then
                  aws s3api put-object --bucket ${BucketName} --key $CLAIMS/shard-$i --body /opt/ws13/claim --metadata state=running,node=$IID >> $LOG 2>&1
                  echo "$(date -u +%FT%TZ) RECLAIMED shard slot $i: unrefreshed for ${!age}s. If its original node is somehow alive, this shard is now being measured twice." >> $LOG
                  echo "$i"; exit 0
                fi
              done
              exit 1;;
            incomplete)
              # An ABSENT claim counts. A slot nobody ever claimed is exactly
              # the silent hole this count exists to expose: it has no object
              # in S3, so a scan that only looked at existing claims would
              # report the run finished.
              n=0
              for i in $(seq 0 $LAST); do
                head=$(head_of $i)
                if [ -z "$head" ]; then n=$((n + 1)); continue; fi
                [ "$(state_of "$head")" = complete ] && continue
                n=$((n + 1))
              done
              echo "$n";;
            *)
              echo "usage: claim_slot.sh claim|incomplete" >&2; exit 2;;
            esac
            CLAIMEOF
            chmod +x /opt/ws13/claim_slot.sh
            docker pull docker.io/jbarlow83/ocrmypdf:latest >> /var/log/ws13-setup.log 2>&1
            if [ "$WS13_MODE" = confidence ]; then
            # The seeder below enqueues the corpus. Running it in this mode
            # would put documents on the OCR queue for a pass that reads no
            # queue, and would re-OCR the very text the measurement exists to
            # judge -- the one conflation this workstream cannot afford. Claim
            # a shard slot instead.
            #
            # The Auto Scaling group hands an instance no ordinal, and
            # WS13_SHARD must be distinct per node or the pass measures some
            # pages twice and never touches others. The slot is claimed with
            # the same S3 conditional put the seed lock above uses: PutObject
            # with If-None-Match '*' succeeds for exactly one caller per key,
            # so the first key this node wins is its slot and no two nodes can
            # win the same one. Deriving the ordinal from the group's instance
            # list was the alternative and is worse: that list changes as nodes
            # launch and terminate, so two nodes reading it seconds apart
            # disagree about both their own index AND the total, which
            # renumbers the shard space mid-run without saying so.
            #
            # FAILURE MODE WHEN A NODE IS REPLACED MID-RUN, stated plainly.
            # The node agent refreshes this claim every 300 s and DELETES it if
            # the node retires with the shard unfinished, so an orderly
            # replacement hands the slot straight back. A node that dies hard
            # (kernel panic, an ASG health-check replacement) deletes nothing,
            # and its claim would otherwise sit there for good: that shard's
            # pages stay NULL, every other shard reports complete, and the run
            # looks finished. claim_slot.sh takes over a claim that has gone
            # ClaimStaleSeconds without a refresh.
            #
            # WHY THIS WAITS INSTEAD OF RETIRING. A replacement for a
            # hard-dead node arrives in a couple of minutes; its predecessor's
            # claim does not go stale for ClaimStaleSeconds (1800 s). So the
            # replacement used to find every slot taken, retire itself WITH
            # --should-decrement-desired-capacity, and permanently remove the
            # only capacity that could ever have reclaimed the dead node's
            # shard. Decrementing is a promise that this node is surplus, and
            # inside the staleness window that promise cannot be made: a claim
            # refreshed 30 s ago and a claim abandoned 30 s ago look identical.
            # After ClaimStaleSeconds plus one refresh interval they do not --
            # anything still unfinished has been refreshed inside the window,
            # which means a live node is holding it and this node really is
            # surplus. So: wait that long, re-attempting the claim, and only
            # then give the capacity back.
              CTOK=$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')
              IID=$(curl -s -H "X-aws-ec2-metadata-token: $CTOK" http://169.254.169.254/latest/meta-data/instance-id)
              CLAIMS=ws13/fleet/confidence/claims
              echo "$IID" > /opt/ws13/claim
              CLAIM_WAIT=$(( ${ClaimStaleSeconds} + 300 ))
              CLAIM_DEADLINE=$(( $(date +%s) + CLAIM_WAIT ))
              SLOT=""
              while : ; do
                SLOT=$(/opt/ws13/claim_slot.sh claim)
                [ -n "$SLOT" ] && break
                unfinished=$(/opt/ws13/claim_slot.sh incomplete)
                if [ "$unfinished" -eq 0 ]; then
                  # Every slot is marked complete. The run is over, this node
                  # is surplus, and giving the capacity back is correct.
                  echo "every one of ${ConfidenceNodeSlots} shard slots is complete; nothing to measure" >> /var/log/ws13-setup.log
                  break
                fi
                if [ "$(date +%s)" -ge "$CLAIM_DEADLINE" ]; then
                  # Stated as an observation, not as a conclusion. head_of
                  # cannot tell "no such object" from "could not ask" -- a
                  # throttled or failing s3api call takes the same branch as
                  # an absent claim -- so a node that never once reached S3
                  # would otherwise retire announcing that live nodes hold
                  # every slot, which it has no evidence for.
                  echo "waited ${!CLAIM_WAIT}s and claimed nothing; ${!unfinished} slot(s) read as unfinished and none went stale. Either live nodes hold them, or this node could not read the claim store -- see /var/log/ws13-claim.log, uploaded beside this file." >> /var/log/ws13-setup.log
                  break
                fi
                echo "no free shard slot yet; ${!unfinished} of ${ConfidenceNodeSlots} unfinished. Holding this node until one goes stale rather than decrementing the group." >> /var/log/ws13-setup.log
                sleep 60
              done
              if [ -z "$SLOT" ]; then
                # Every slot is complete, or every unfinished one is held by a
                # node that is demonstrably alive. Retire the way a drained
                # node does -- terminate AND decrement -- and retry it, because
                # the call is rejected while the instance is still Pending and
                # the fallback below does NOT decrement: `shutdown` alone
                # leaves DesiredCapacity untouched, the group launches a
                # replacement, and the replacement reaches this same line. That
                # is the boot/die/replace loop the hold logic further down
                # exists to prevent.
                echo "no claimable confidence shard slot of ${ConfidenceNodeSlots} after waiting ${!CLAIM_WAIT}s; retiring" >> /var/log/ws13-setup.log
                # Both logs. ws13-claim.log holds every s3api error this node
                # hit while trying to claim, and it is the only record of WHY
                # it could not -- node_agent.sh's upload_logs, which sweeps
                # every ws13-* file, is never reached on this path.
                aws s3 cp /var/log/ws13-setup.log s3://${BucketName}/ws13/fleet/logs/"$(hostname)"/ws13-setup.log
                aws s3 cp /var/log/ws13-claim.log s3://${BucketName}/ws13/fleet/logs/"$(hostname)"/ws13-claim.log
                for a in 1 2 3 4 5 6; do
                  aws autoscaling terminate-instance-in-auto-scaling-group --instance-id "$IID" --should-decrement-desired-capacity >> /var/log/ws13-setup.log 2>&1 && exit 0
                  sleep 30
                done
                shutdown -h now
                exit 0
              fi
              export WS13_NODE_SLOT=$SLOT WS13_CLAIM_KEY=$CLAIMS/shard-$SLOT
              export WS13_WORKERS_PER_NODE=${WorkersPerNode}
              export WS13_SHARD_COUNT=$(( ${ConfidenceNodeSlots} * ${WorkersPerNode} ))
              export WS13_SWEEP_DOCS=${ConfidenceSweepDocs}
              export WS13_SWEEP_MAX_SECONDS=${ConfidenceSweepMaxSeconds}
              # ws13_worker.py's own default for the drain file, restated so the
              # confidence wrapper and the node agent share one contract
              # instead of each knowing a default.
              export WS13_DRAIN_FILE=/opt/ws13/drain
              echo "confidence shard slot $SLOT of ${ConfidenceNodeSlots}; shards $(( SLOT * ${WorkersPerNode} ))-$(( SLOT * ${WorkersPerNode} + ${WorkersPerNode} - 1 )) of $WS13_SHARD_COUNT" >> /var/log/ws13-setup.log
            else
            # exactly one node seeds: an SQS-backed lock via S3 conditional put
            touch /opt/ws13/empty; if aws s3api put-object --bucket ${BucketName} --key ws13/fleet/seed.lock --body /opt/ws13/empty --if-none-match '*' >> /var/log/ws13-setup.log 2>&1; then
              aws s3 cp s3://${BucketName}/ws13/fleet/manifest.jsonl var/ws12/manifest.jsonl >> /var/log/ws13-setup.log 2>&1 || true
              python3 ws13_seed.py --bucket ${BucketName} --queue-url ${QueueUrl} --dsn "$WS13_DB_DSN" >> /var/log/ws13-seed.log 2>&1
              aws s3 cp /var/log/ws13-seed.log s3://${BucketName}/ws13/fleet/seed.log
            else
              # wait for the seeder to finish schema init before workers start
              until aws s3 ls s3://${BucketName}/ws13/fleet/seed.log >/dev/null 2>&1; do sleep 15; done
            fi
            fi
            # Each worker runs under a wrapper that records its EXIT STATUS.
            # "all workers gone" is not one condition but two -- the queue
            # drained (exit 0) or the process died at startup (non-zero, e.g.
            # the pip install above exhausted its retries, bundle.tar.gz is
            # stale, or WS13_BUCKET/WS13_QUEUE_URL/WS13_DB_DSN are unset) --
            # and the node must not treat the second as the first.
            cat > /opt/ws13/run_worker.sh <<'RUNEOF'
            #!/bin/bash
            cd /opt/ws13
            if [ "$WS13_MODE" = confidence ]; then
              # WS13_SHARD is this PROCESS's index, not the node's: the node
              # owns slot WS13_NODE_SLOT and its WS13_WORKERS_PER_NODE
              # processes take the consecutive shards inside it, so every
              # process in the group divides by the same WS13_SHARD_COUNT and
              # the shard space is a partition rather than a set of guesses.
              #
              # The pass is SWEPT, not run once, because its exit code answers
              # "is this shard finished", not "did this process work":
              # ws13_confidence_pass.main() returns 0 only when the shard has
              # 0 pages left, and work routinely remains after a sweep
              # (run_shard() stops on lack of progress, and a document cut
              # short by its 3600 s deadline leaves pages behind -- the
              # 1,407-page document needs three deadlines). Handing that to
              # node_agent.sh as a failure would be read as a dead worker --
              # bad=8 of COUNT=8, node parked in the 6 h hold,
              # ws13-worker-exit-failures in ALARM -- on the most ordinary
              # outcome a first sweep has.
              #
              # THE OVERLOADED 1. That "work remains" answer used to BE exit 1,
              # which is also CPython's status for any uncaught exception. This
              # loop could not tell an ordinary first sweep from a process that
              # died on an unhandled error, so a crashing pass was re-run
              # immediately, with no backoff, for the full 24 h ceiling. The
              # pass now answers with distinct codes and 1 is left to mean what
              # the interpreter makes it mean:
              #   0  this shard is measured
              #   10 pages remain and this sweep measured some -> sweep again
              #   11 pages remain and this sweep measured NOTHING -> back off
              #   2  shard arithmetic outside 0..shards-1   } real failures,
              #   3  no docker or no page renderer          } passed through
              #   1  unhandled: retried, then treated as a failure after
              #      CONF_MAX_FAULTS CONSECUTIVE occurrences
              # Only 10, 11 and 1 are swept again. Anything else -- 12, or a
              # signal death like 137 (OOM) or 127 -- leaves the loop on its
              # FIRST occurrence and is handed to the node agent as-is, which
              # is deliberate: those say the environment is wrong, and a
              # second identical sweep learns nothing. (This comment used to
              # say "1 or anything else", which promised those codes three
              # retries they have never had.) 11 backs off geometrically
              # because a sweep that measured nothing will measure nothing
              # again a second later, and gives up after CONF_MAX_STALLS so a
              # wedged shard surfaces within minutes instead of at the 24 h
              # ceiling. Both counters are consecutive in fact as well as in
              # name: each arm zeroes the other's counter.
              #
              # Two other stops: the drain file, which reports 0 because being
              # asked to leave is not a failure (the agent then releases the
              # claim so another node re-measures the shard), and the
              # wall-clock ceiling, which leaves the last non-zero rc in place
              # so a shard that will not converge holds its node and raises the
              # alarm instead of sweeping for ever.
              SHARD=$(( WS13_NODE_SLOT * WS13_WORKERS_PER_NODE + $1 - 1 ))
              LOG=/var/log/ws13-confidence-"$1".log
              END=$(( $(date +%s) + WS13_SWEEP_MAX_SECONDS ))
              CONF_BACKOFF_START=60
              CONF_BACKOFF_MAX=900
              CONF_MAX_STALLS=6
              CONF_MAX_FAULTS=3
              backoff=$CONF_BACKOFF_START
              stalls=0
              faults=0
              rc=10
              while [ "$rc" -eq 10 ] || [ "$rc" -eq 11 ] || [ "$rc" -eq 1 ]; do
                if [ -f "$WS13_DRAIN_FILE" ]; then
                  echo "drain requested; shard $SHARD left unfinished for another node" >> "$LOG"
                  rc=0
                  break
                fi
                if [ "$(date +%s)" -ge "$END" ]; then
                  echo "shard $SHARD still unfinished after $WS13_SWEEP_MAX_SECONDS s; giving up (last rc=$rc)" >> "$LOG"
                  break
                fi
                WS13_SHARD=$SHARD WS13_WORKER_ID="$(hostname)-$1" \
                  python3 ws13_confidence_pass.py --limit "$WS13_SWEEP_DOCS" >> "$LOG" 2>&1
                rc=$?
                if [ "$rc" -eq 10 ]; then
                  # Progress. Reset both counters and sweep straight on.
                  backoff=$CONF_BACKOFF_START; stalls=0; faults=0
                elif [ "$rc" -eq 11 ]; then
                  # Each counter is reset by ANY other outcome, not only by
                  # rc=10. Resetting on 10 alone made neither count
                  # consecutive: a shard alternating 11,1,11,1,11,1 reached
                  # faults=3 with no two exit-1s adjacent, abandoned the
                  # shard, and logged "3 times" as though it had crash-looped.
                  faults=0
                  stalls=$((stalls + 1))
                  if [ "$stalls" -ge "$CONF_MAX_STALLS" ]; then
                    echo "shard $SHARD measured nothing in $stalls consecutive sweeps; not sweeping again" >> "$LOG"
                    break
                  fi
                  echo "shard $SHARD measured nothing; sleeping ${!backoff}s before sweep $((stalls + 1))" >> "$LOG"
                  sleep $backoff
                  backoff=$((backoff * 2))
                  [ "$backoff" -gt "$CONF_BACKOFF_MAX" ] && backoff=$CONF_BACKOFF_MAX
                elif [ "$rc" -eq 1 ]; then
                  # An unhandled exception, now distinguishable. Retried a few
                  # times because a torn database connection presents this way,
                  # but never hot-looped and never for 24 h.
                  stalls=0
                  faults=$((faults + 1))
                  if [ "$faults" -ge "$CONF_MAX_FAULTS" ]; then
                    echo "shard $SHARD exited 1 (unhandled) $faults times; leaving it failed for the node agent" >> "$LOG"
                    break
                  fi
                  echo "shard $SHARD exited 1 (unhandled); sleeping ${!backoff}s" >> "$LOG"
                  sleep $backoff
                  backoff=$((backoff * 2))
                  [ "$backoff" -gt "$CONF_BACKOFF_MAX" ] && backoff=$CONF_BACKOFF_MAX
                fi
              done
              echo "$rc" > /opt/ws13/status/"$1"
              exit 0
            fi
            WS13_WORKER_ID="$(hostname)-$1" python3 ws13_worker.py >> /var/log/ws13-worker-"$1".log 2>&1
            echo $? > /opt/ws13/status/"$1"
            RUNEOF
            chmod +x /opt/ws13/run_worker.sh
            # A file, not a loop inline here, because the node agent starts
            # workers too: in confidence mode a node that finishes its own
            # shard adopts an orphaned slot rather than retiring, and that
            # means launching a second generation of workers with the same
            # contract -- same count, same status directory, same pid file.
            cat > /opt/ws13/start_workers.sh <<'STARTEOF'
            #!/bin/bash
            # Launch this node's worker processes and record their pids.
            # The status directory is CLEARED first: node_agent.sh reads
            # "every worker wrote a status" as the completion condition, so a
            # second generation starting with the first generation's status
            # files would be seen as finished before it had run.
            rm -rf /opt/ws13/status
            mkdir -p /opt/ws13/status
            pids=""
            for i in $(seq 1 ${WorkersPerNode}); do
              nohup /opt/ws13/run_worker.sh $i >/dev/null 2>&1 &
              pids="$pids $!"
            done
            echo "$pids" > /opt/ws13/worker.pids
            STARTEOF
            chmod +x /opt/ws13/start_workers.sh
            /opt/ws13/start_workers.sh
            cat > /opt/ws13/node_agent.sh <<'AGENTEOF'
            #!/bin/bash
            # One loop that owns this node's whole life: wait for the workers,
            # keep the queue's CloudWatch series alive, honour a scale-in
            # drain, then classify the exit and either retire the node, adopt
            # another shard slot, or hold it for diagnosis.
            # usage: node_agent.sh <worker count>
            #
            # The watcher this replaces looped on 'pgrep -f ws13_worker.py',
            # which also matched its own command line, so the condition was
            # never false: no node ever uploaded a log or scaled itself in.
            #
            # The pids are read from /opt/ws13/worker.pids rather than taken
            # on argv, because in confidence mode this agent can start a
            # SECOND generation of workers -- see the adopt step below -- and
            # a pid list frozen at boot would then be watching processes that
            # have already exited.
            COUNT=$1; shift
            STATUS=/opt/ws13/status
            exec >> /var/log/ws13-node-agent.log 2>&1
            say() { echo "$(date -u +%FT%TZ) $*"; }
            imds() {
              tok=$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
              curl -s -H "X-aws-ec2-metadata-token: $tok" http://169.254.169.254/latest/meta-data/"$1"
            }
            IID=$(imds instance-id)
            # The NODE's clock, set once and never reset. GEN_BOOT below is
            # the current generation's, and the two must not be the same
            # variable: the "everything died immediately, so this is a bad
            # bundle" heuristic asks about the node's life, and reading a
            # generation clock there parked a node that had already measured
            # a whole shard in the 6 h hold over one worker failing ten
            # seconds after it adopted the next slot.
            AGENT_BOOT=$(date +%s)
            GEN_BOOT=$AGENT_BOOT
            # Inherited from the UserData exports. Defaulted anyway, so an
            # agent started by hand on an older node behaves like the ocr
            # fleet rather than dereferencing an empty claim key.
            MODE="$WS13_MODE"
            [ -n "$MODE" ] || MODE=ocr
            say "agent up: $COUNT workers, instance $IID, mode $MODE"
            drain=0
            # Outer loop: one iteration per generation of workers. In ocr mode
            # it runs exactly once. In confidence mode a node that has finished
            # its own shard cleanly may adopt an orphaned slot and come round
            # again, which is what stops the group decrementing to zero with a
            # shard nobody ever measured.
            while :; do
            PIDS=$(cat /opt/ws13/worker.pids 2>/dev/null)
            say "watching pids $PIDS for slot ${!WS13_NODE_SLOT:-none}"
            tick=0
            while :; do
              live=0
              for p in $PIDS; do
                if kill -0 "$p" 2>/dev/null; then live=$((live + 1)); fi
              done
              finished=$(ls -1 $STATUS 2>/dev/null | wc -l | tr -d ' ')
              # Two independent proofs, so a recycled PID cannot hang the node
              # and a SIGKILLed worker cannot hide: every worker wrote a
              # status, or nothing is alive any more.
              # This is the completion condition in BOTH modes, on purpose:
              # it asks about the processes and never about the queue. An ocr
              # worker exits when the queue drains; a confidence process exits
              # when its shard is measured, and "the queue is empty" would be
              # true from its first second -- a loop waiting on that would
              # never end. Either way the node is finished when its processes
              # are. The queue read below is only a CloudWatch keepalive and
              # has never been what ends this loop.
              if [ "$finished" -ge "$COUNT" ] || [ "$live" -eq 0 ]; then break; fi
              # One cheap call a minute keeps the work queue "active" so
              # CloudWatch keeps publishing AWS/SQS metrics. Those series stop
              # after six hours with no messages AND no API calls -- exactly
              # the state ws13-fleet-idle exists to detect, which is why that
              # alarm sat in INSUFFICIENT_DATA (TreatMissingData notBreaching,
              # so: silent) through 53.78 h of four idle c7g.2xlarge nodes.
              if [ "$MODE" = ocr ] && [ $((tick % 3)) -eq 0 ]; then
                aws sqs get-queue-attributes --queue-url ${QueueUrl} --attribute-names ApproximateNumberOfMessages > /dev/null 2>&1
              fi
              # confidence mode has no queue to keep alive -- it is empty for
              # the whole run by design. Two things take its place every 300 s.
              # The shard claim is refreshed, which is what stops another node
              # from deciding this one is dead and re-measuring its shard. And
              # ShardHeld=1 is published, which is what ws13-fleet-idle reads
              # in this mode instead of a queue depth that would call every
              # working node idle.
              if [ "$MODE" = confidence ] && [ $((tick % 15)) -eq 0 ]; then
                aws s3api put-object --bucket ${BucketName} --key "$WS13_CLAIM_KEY" --body /opt/ws13/claim --metadata state=running,node="$IID" > /dev/null 2>&1
                aws cloudwatch put-metric-data --namespace WS13/Fleet --metric-name ShardHeld --unit Count --value 1 --dimensions AutoScalingGroupName=${FleetName} > /dev/null 2>&1
              fi
              if [ "$drain" -eq 0 ] && [ "$(imds autoscaling/target-lifecycle-state)" = Terminated ]; then
                drain=1
                touch /opt/ws13/drain
                say "scale-in requested: workers will finish the document in hand and exit"
              fi
              # Each heartbeat resets the hook's timeout, so a node draining a
              # long document is not cut off at HeartbeatTimeout.
              # ocr only, and that is what the heartbeat is for: a node
              # draining a 1,407-page document must not be cut off at
              # HeartbeatTimeout. In confidence mode the unit of work is one
              # sweep of ConfidenceSweepDocs documents and the wrapper checks
              # the drain file between sweeps -- so a draining node leaves in
              # one sweep (~7 min at the batched 1.6 s/page seed, the same
              # number the ConfidenceSweepDocs description gives) plus, if
              # the wrapper is mid-backoff on a stalled shard, up to
              # CONF_BACKOFF_MAX (900 s) before it looks at the drain file at
              # all: ~22 min worst case. This comment said "about half an
              # hour", which was the old 5-8 s/page figure that description
              # no longer uses. Either way it is far inside the hook's 7200 s,
              # and extending the hook indefinitely here would only let a
              # wedged process hold a node for ever. The hook
              # itself is untouched -- its 7200 s HeartbeatTimeout and
              # DefaultResult CONTINUE stay the ceiling, and a node terminated
              # that way leaves a claim that goes stale and is reclaimed, so
              # the shard is re-measured rather than lost.
              if [ "$MODE" = ocr ] && [ "$drain" -eq 1 ] && [ $((tick % 30)) -eq 0 ]; then
                aws autoscaling record-lifecycle-action-heartbeat --auto-scaling-group-name ${FleetName} --lifecycle-hook-name ws13-drain --instance-id "$IID" || true
              fi
              tick=$((tick + 1))
              sleep 20
            done
            failures=0
            for f in $STATUS/*; do
              [ -f "$f" ] || continue
              if [ "$(cat "$f")" != 0 ]; then failures=$((failures + 1)); fi
              echo "worker $(basename "$f") exit=$(cat "$f")" >> /var/log/ws13-worker-exit-status.txt
            done
            finished=$(ls -1 $STATUS 2>/dev/null | wc -l | tr -d ' ')
            bad=$((failures + COUNT - finished))
            say "workers done: $finished/$COUNT reported, $bad bad, drain=$drain"
            upload_logs() { aws s3 cp /var/log/ s3://${BucketName}/ws13/fleet/logs/"$(hostname)"/ --recursive --exclude "*" --include "ws13-*"; }
            upload_logs
            aws cloudwatch put-metric-data --namespace WS13/Fleet --metric-name WorkerExitFailures --unit Count --value $bad --dimensions AutoScalingGroupName=${FleetName}
            # Give the shard slot back, or mark it done. Marking complete stops
            # a node that boots later from paying to re-walk a shard that is
            # already measured; deleting is what makes an unfinished shard
            # claimable again. Anything that is not a clean finish releases,
            # because an unreleased unfinished shard is unmeasured pages that
            # no log, metric or alarm would ever mention.
            if [ "$MODE" = confidence ]; then
              # Both calls are RETRIED and their status is CHECKED. Neither
              # used to be, and the log said "complete" or "RELEASED" either
              # way -- an assertion about the claim store made without
              # reading the answer. The failure that matters is the delete: a
              # released slot is ABSENT, which the next node's conditional
              # put wins immediately, while a slot left at state=running with
              # a fresh timestamp is untouchable for another
              # ClaimStaleSeconds. So a failed delete silently converts "free
              # now" into "free in half an hour" while the log claims the
              # first.
              claim_write() {
                for a in 1 2 3; do
                  if "$@" > /dev/null 2>&1; then return 0; fi
                  sleep 5
                done
                return 1
              }
              if [ "$drain" -eq 0 ] && [ "$bad" -eq 0 ]; then
                if claim_write aws s3api put-object --bucket ${BucketName} --key "$WS13_CLAIM_KEY" --body /opt/ws13/claim --metadata state=complete,node="$IID"; then
                  say "shard slot $WS13_NODE_SLOT complete"
                else
                  say "WARNING: shard slot $WS13_NODE_SLOT IS measured but could not be marked complete; it stays state=running and will read as incomplete in SlotsIncomplete and to any node that inspects it. Re-run --verify-complete before believing this slot is unmeasured."
                fi
              else
                if claim_write aws s3api delete-object --bucket ${BucketName} --key "$WS13_CLAIM_KEY"; then
                  say "shard slot $WS13_NODE_SLOT RELEASED unfinished (drain=$drain bad=$bad); its remaining pages stay NULL until a node reclaims the slot"
                else
                  say "WARNING: could not release shard slot $WS13_NODE_SLOT (drain=$drain bad=$bad); the claim is still present, so no node can take it for another ${ClaimStaleSeconds}s rather than immediately"
                fi
              fi
              # ADOPT BEFORE RETIRING. Nothing used to assert that every slot
              # reached 'complete': once the group decremented to zero, "the
              # run finished" and "the run finished with slots nobody ever
              # claimed" were the same observable -- the same silent-hole
              # defect as the rc=127 that left 760,059 pages unmeasured while
              # every log said success. A node that has finished its own shard
              # is the one piece of capacity in the account that is provably
              # able to measure another, so before it hands that capacity back
              # it looks for a slot that is unclaimed or whose holder has gone
              # ClaimStaleSeconds without a refresh, and takes it.
              #
              # This is what makes the group's decrement to zero mean
              # something: the last node out has, by then, found no claimable
              # slot at all.
              # AND IT WAITS, for the same reason the boot-time claim loop
              # waits. One attempt was not enough: inside ClaimStaleSeconds a
              # claim refreshed 30 s ago and a claim abandoned 30 s ago are
              # the same object, so a single miss here fell through to a
              # --should-decrement-desired-capacity that promises this node
              # is surplus -- the exact blocker the boot-time wait was added
              # to remove, replicated at the other end of the node's life,
              # and worse here because this node has already proved it can
              # measure a shard. Same deadline, same 60 s poll, and the same
              # early exit when nothing is left unfinished.
              if [ "$drain" -eq 0 ] && [ "$bad" -eq 0 ]; then
                NEXT=""
                ADOPT_DEADLINE=$(( $(date +%s) + ${ClaimStaleSeconds} + 300 ))
                while : ; do
                  NEXT=$(/opt/ws13/claim_slot.sh claim)
                  [ -n "$NEXT" ] && break
                  left=$(/opt/ws13/claim_slot.sh incomplete)
                  if [ "$left" -eq 0 ]; then
                    say "every one of ${ConfidenceNodeSlots} slots is complete; nothing left to adopt"
                    break
                  fi
                  if [ "$(date +%s)" -ge "$ADOPT_DEADLINE" ]; then
                    say "waited out ClaimStaleSeconds+300 with ${!left} slot(s) unfinished: every one was refreshed inside the window, so a live node holds it and this node really is surplus"
                    break
                  fi
                  say "no adoptable slot yet (${!left} unfinished); holding this node rather than decrementing the group"
                  sleep 60
                done
                if [ -n "$NEXT" ]; then
                  export WS13_NODE_SLOT=$NEXT
                  export WS13_CLAIM_KEY=ws13/fleet/confidence/claims/shard-$NEXT
                  say "ADOPTED shard slot $NEXT: it was unclaimed or its holder stopped refreshing. Measuring it rather than decrementing the group."
                  /opt/ws13/start_workers.sh
                  # Generation clock only. AGENT_BOOT, set once before the
                  # outer loop, is what the 'everything died immediately'
                  # heuristic reads -- resetting THAT here parked a node that
                  # had already driven a shard to complete in the 6 h hold
                  # over one partial failure ten seconds into generation 2.
                  GEN_BOOT=$(date +%s)
                  continue
                fi
              fi
              # Nothing claimable. Publish what is still outstanding, so the
              # difference between "finished" and "stopped" is a number an
              # alarm can read rather than an inference from an empty group.
              incomplete=$(/opt/ws13/claim_slot.sh incomplete)
              aws cloudwatch put-metric-data --namespace WS13/Fleet --metric-name SlotsIncomplete --unit Count --value "$incomplete" --dimensions AutoScalingGroupName=${FleetName} > /dev/null 2>&1
              if [ "$incomplete" -gt 0 ]; then
                say "WARNING: retiring with $incomplete of ${ConfidenceNodeSlots} shard slots not complete. Their claims are being refreshed by other nodes, or this node is draining/failed. Confirm the run with: ws13_confidence_pass.py --verify-complete --shards $(( ${ConfidenceNodeSlots} * ${WorkersPerNode} ))"
              else
                say "all ${ConfidenceNodeSlots} shard slots complete"
              fi
            fi
            break
            done
            if [ "$drain" -eq 1 ]; then
              aws autoscaling complete-lifecycle-action --auto-scaling-group-name ${FleetName} --lifecycle-hook-name ws13-drain --instance-id "$IID" --lifecycle-action-result CONTINUE
              exit 0
            fi
            ran=$(( $(date +%s) - AGENT_BOOT ))
            # Nothing survived, or everything died immediately: that is a bad
            # bundle / bad environment, not a drained queue. Retiring here
            # would let the still-full backlog request capacity again at once
            # and 40 nodes would boot, die and retire in a loop with nothing
            # indexed. Hold the node instead -- republishing the failure
            # metric so the alarm STAYS in ALARM rather than blinking once --
            # and give up after 21600 s (6 h), so a failure nobody looks at
            # costs a node-day at most, not a c7g.4xlarge forever. A PARTIAL
            # failure after real work is different: the metric is published,
            # the exit statuses go to S3, and the node still retires.
            if [ "$bad" -ge "$COUNT" ] || { [ "$bad" -gt 0 ] && [ "$ran" -lt 300 ]; }; then
              say "HELD after ${!ran}s: $bad of $COUNT workers exited non-zero; see /var/log/ws13-worker-*.log"
              held=0
              while [ "$held" -lt 21600 ]; do
                sleep 300
                held=$((held + 300))
                aws cloudwatch put-metric-data --namespace WS13/Fleet --metric-name WorkerExitFailures --unit Count --value $bad --dimensions AutoScalingGroupName=${FleetName}
                # A held node is still in service and still idle, so keep the
                # queue series alive for ws13-fleet-idle, and leave at once if
                # the group asks for the node back -- there is nothing left to
                # drain.
                if [ "$MODE" = ocr ]; then
                  aws sqs get-queue-attributes --queue-url ${QueueUrl} --attribute-names ApproximateNumberOfMessages > /dev/null 2>&1
                else
                  # A held node in confidence mode is in service and measuring
                  # nothing, which is exactly what ws13-fleet-idle exists to
                  # catch here. Its claim was released above, so this publishes
                  # 0 rather than pretending to still hold a shard.
                  aws cloudwatch put-metric-data --namespace WS13/Fleet --metric-name ShardHeld --unit Count --value 0 --dimensions AutoScalingGroupName=${FleetName} > /dev/null 2>&1
                fi
                if [ "$(imds autoscaling/target-lifecycle-state)" = Terminated ]; then
                  upload_logs
                  aws autoscaling complete-lifecycle-action --auto-scaling-group-name ${FleetName} --lifecycle-hook-name ws13-drain --instance-id "$IID" --lifecycle-action-result CONTINUE
                  exit 0
                fi
              done
              say "hold expired; retiring the node"
              upload_logs
            fi
            # Queue drained. Leave the group properly: terminate AND decrement
            # DesiredCapacity, or the group just launches a replacement.
            aws autoscaling terminate-instance-in-auto-scaling-group --instance-id "$IID" --should-decrement-desired-capacity || shutdown -h now
            AGENTEOF
            chmod +x /opt/ws13/node_agent.sh
            nohup /opt/ws13/node_agent.sh ${WorkersPerNode} >/dev/null 2>&1 &

  Fleet:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Ref FleetName
      LaunchTemplate: {LaunchTemplateId: !Ref LaunchTemplate, Version: !GetAtt LaunchTemplate.LatestVersionNumber}
      MinSize: 0
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: !Ref SubnetIds
      # Not scale-in protection: the DrainHook below drains instead, which
      # lets the policy still scale in while never killing a node mid
      # document. Protection would have blocked policy scale-in outright.
      NewInstancesProtectedFromScaleIn: false
      # Group metrics are off unless asked for. Without GroupInServiceInstances
      # the scaling expression below has no denominator series and the policy
      # sits in INSUFFICIENT_DATA forever -- the same silent-no-op class of
      # defect as the pgrep watcher.
      MetricsCollection:
        - Granularity: 1Minute
          Metrics: [GroupInServiceInstances, GroupDesiredCapacity, GroupTotalInstances]
      Tags: [{Key: Name, Value: ws13-worker, PropagateAtLaunch: true}]

  # A scale-in used to terminate a node the instant the policy asked for it,
  # while up to WorkersPerNode documents were half-OCR'd on it. Each of those
  # messages went back to SQS with ReceiveCount incremented and three rounds
  # of that dead-lettered a document nothing polls. The hook holds the
  # termination while the node agent sets /opt/ws13/drain, each worker
  # finishes the document in hand and exits, and the agent then completes the
  # action. HeartbeatTimeout matches WS13_DOC_BUDGET_SECONDS (7200 s), the
  # worker's hard per-document budget, and the agent re-records the heartbeat
  # every ~10 minutes while draining. DefaultResult CONTINUE: if the agent is
  # dead, terminate rather than wedge the group.
  DrainHook:
    Type: AWS::AutoScaling::LifecycleHook
    Properties:
      AutoScalingGroupName: !Ref Fleet
      LifecycleHookName: ws13-drain
      LifecycleTransition: autoscaling:EC2_INSTANCE_TERMINATING
      HeartbeatTimeout: 7200
      DefaultResult: CONTINUE

  # Target tracking, not step scaling. A step policy needs a hand-tuned ladder
  # of absolute queue depths, has to be re-tuned whenever MaxSize or the
  # per-document cost changes, and needs a second, separately-tuned policy for
  # the way down -- which is why there has never been one and the group has
  # only ever been scaled in manually. One ratio (messages per in-service node)
  # is scale-invariant and drives both directions from a single policy.
  #
  # ocr mode only, and deliberately absent rather than neutered in confidence
  # mode. The ratio this policy tracks is SQS backlog per in-service node, and
  # in confidence mode that backlog is 0 for the entire run: the policy would
  # read "no work", drive DesiredCapacity to MinSize 0 within minutes, and
  # terminate every node mid-measurement. Nothing replaces it, because
  # capacity there is not demand-driven. It is bounded above by
  # ConfidenceNodeSlots -- a node that can claim no slot, after waiting out
  # ClaimStaleSeconds, retires itself -- and shrinks from below as each node
  # finishes its shard and leaves the group with
  # --should-decrement-desired-capacity. That is a real scale-in signal:
  # completion, reported by the node that did the work. And it is only a
  # completion signal because a finishing node ADOPTS an unclaimed or
  # abandoned slot before it retires, so the group reaching 0 means no slot
  # was claimable -- not merely that every node happened to stop. The
  # WS13/Fleet SlotsIncomplete metric records what was still outstanding at
  # each retirement; the assertion that actually proves the run is
  # `ws13_confidence_pass.py --verify-complete --shards N`, which reads
  # ws13_pages rather than these claim objects.
  #
  # Consequence to know before deploying: flipping FleetMode to confidence
  # DELETES this policy from the live stack, along with the two alarms AWS
  # creates behind it, and flipping back to ocr recreates it. MinSize, MaxSize
  # and DesiredCapacity on the group are untouched either way.
  BacklogScaling:
    Condition: IsOcrMode
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Fleet
      PolicyType: TargetTrackingScaling
      # Boot installs packages and pulls the ocrmypdf image before a worker
      # takes its first message; counting a node before then would stack up
      # capacity that is not yet working.
      EstimatedInstanceWarmup: 600
      TargetTrackingConfiguration:
        # Explicit: scale-in is the whole point of adding this.
        DisableScaleIn: false
        TargetValue: !Ref BacklogPerInstanceTarget
        CustomizedMetricSpecification:
          Metrics:
            - Id: visible
              ReturnData: false
              MetricStat:
                Stat: Sum
                Period: 60
                Metric:
                  Namespace: AWS/SQS
                  MetricName: ApproximateNumberOfMessagesVisible
                  Dimensions: [{Name: QueueName, Value: !Ref QueueName}]
            # In-flight work is work. At the tail of a run the queue reaches
            # 0 visible while WorkersPerNode x N documents are still being
            # OCR'd; on visible alone the ratio hit 0, the policy drove
            # DesiredCapacity to 0, and every node holding a document was
            # terminated. Those messages reappeared with ReceiveCount
            # incremented, the backlog jumped, the group scaled back out --
            # and three cycles put a document nothing polls into
            # ws13-ocr-dlq. The IdleFleetAlarm below already counted both
            # series for exactly this reason; the scaling policy contradicted
            # it. This stops the policy from reading in-flight work as no
            # work; it does not by itself make a scale-in safe (8 in-flight
            # documents against a target of 120 is still a small ratio) --
            # DrainHook above is what keeps the documents.
            - Id: inflight
              ReturnData: false
              MetricStat:
                Stat: Sum
                Period: 60
                Metric:
                  Namespace: AWS/SQS
                  MetricName: ApproximateNumberOfMessagesNotVisible
                  Dimensions: [{Name: QueueName, Value: !Ref QueueName}]
            - Id: capacity
              ReturnData: false
              MetricStat:
                Stat: Average
                Period: 60
                Metric:
                  Namespace: AWS/AutoScaling
                  MetricName: GroupInServiceInstances
                  Dimensions: [{Name: AutoScalingGroupName, Value: !Ref Fleet}]
            # The IF guard is what lets MinSize stay 0: at zero in-service
            # instances the ratio would divide by zero and the policy would
            # never scale out again, stranding the queue.
            - Id: backlog_per_instance
              Label: SQS backlog per in-service worker node
              ReturnData: true
              Expression: >-
                (FILL(visible, 0) + FILL(inflight, 0)) /
                IF(capacity > 0, capacity, 1)

  # An idle fleet costs c7g.4xlarge-hours and says nothing; this account has
  # had zero CloudWatch alarms. Both message counts are used because in-flight
  # work is not visible work: a node processing a 900-page scan holds its
  # message, and calling that idle would page on healthy behaviour.
  IdleFleetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ws13-fleet-idle
      AlarmDescription: >-
        WS13 worker nodes are in service while the work queue has been empty
        (nothing visible, nothing in flight) for 30 minutes. Scale-in should
        have handled this; if the alarm holds, the target-tracking policy or
        the node self-shutdown is not working.
        CloudWatch stops publishing AWS/SQS metrics for a queue with no
        messages and no API calls for six hours -- which is this exact
        failure -- so the node agent polls GetQueueAttributes once a minute
        to keep the series alive, and the expression FILLs the queue series
        so a sparse gap cannot resolve the alarm to OK either.
        In confidence mode the same question is put to a different series.
        The work queue is empty for the whole run by design, so queue depth
        would report every node idle for hours. The node agent publishes
        WS13/Fleet ShardHeld every 300 s instead -- 1 while it holds a shard
        slot with live processes, 0 while it sits in the bad-bundle hold --
        and the alarm fires on a node that is in service holding no shard.
      # The whole list is switched rather than individual entries dropped, so
      # the ocr branch below is exactly the four metrics this alarm has always
      # had. capacity and idle_instances are repeated in the second branch;
      # that repetition is the price of not relying on AWS::NoValue to delete
      # list items out of a live alarm.
      Metrics: !If
        - IsOcrMode
        - - Id: visible
            ReturnData: false
            MetricStat:
              Stat: Maximum
              Period: 300
              Metric:
                Namespace: AWS/SQS
                MetricName: ApproximateNumberOfMessagesVisible
                Dimensions: [{Name: QueueName, Value: !Ref QueueName}]
          - Id: inflight
            ReturnData: false
            MetricStat:
              Stat: Maximum
              Period: 300
              Metric:
                Namespace: AWS/SQS
                MetricName: ApproximateNumberOfMessagesNotVisible
                Dimensions: [{Name: QueueName, Value: !Ref QueueName}]
          - Id: capacity
            ReturnData: false
            MetricStat:
              Stat: Average
              Period: 300
              Metric:
                Namespace: AWS/AutoScaling
                MetricName: GroupInServiceInstances
                Dimensions: [{Name: AutoScalingGroupName, Value: !Ref Fleet}]
          - Id: idle_instances
            Label: In-service nodes with nothing to do
            ReturnData: true
            Expression: IF(FILL(visible, 0) + FILL(inflight, 0) < 1, capacity, 0)
        # Minimum, not Average: one node parked in the hold while 39 measure is
        # still a c7g.4xlarge burning for nothing, and an average would bury
        # it. A node that finishes cleanly stops publishing rather than
        # publishing 0, so a completed run resolves to no data, not to ALARM.
        # Known gap, stated rather than papered over: if every node agent dies
        # the series stops entirely, metric math over an empty series yields no
        # datapoint, and TreatMissingData below resolves that to notBreaching
        # -- the same blind spot the ocr branch has when the SQS series ages
        # out, and the reason the agent keeps a series alive at all.
        - - Id: held
            ReturnData: false
            MetricStat:
              Stat: Minimum
              Period: 300
              Metric:
                Namespace: WS13/Fleet
                MetricName: ShardHeld
                Dimensions: [{Name: AutoScalingGroupName, Value: !Ref FleetName}]
          - Id: capacity
            ReturnData: false
            MetricStat:
              Stat: Average
              Period: 300
              Metric:
                Namespace: AWS/AutoScaling
                MetricName: GroupInServiceInstances
                Dimensions: [{Name: AutoScalingGroupName, Value: !Ref Fleet}]
          - Id: idle_instances
            Label: In-service nodes with nothing to do
            ReturnData: true
            Expression: IF(FILL(held, 1) < 1, capacity, 0)
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      EvaluationPeriods: 6
      DatapointsToAlarm: 6
      # Missing data means no fleet and no queue traffic, which is the normal
      # resting state, not a problem.
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # A node whose workers all died at startup used to be indistinguishable
  # from a node whose queue drained: both ended in the same self-shutdown.
  # With a bad bundle that meant every node stopping seconds after boot while
  # the still-full queue drove BacklogScaling to MaxSize 40 -- a boot/die
  # loop that indexes nothing. The node agent now publishes what actually
  # happened, and holds a failed node instead of retiring it, republishing
  # this metric every 5 minutes so the alarm stays up rather than blinking.
  WorkerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ws13-worker-exit-failures
      AlarmDescription: >-
        WS13 worker processes exited non-zero (or vanished without writing an
        exit status). The node that reported it is held in service, not
        retired: read s3://<bucket>/ws13/fleet/logs/<host>/ (ws13-node-agent,
        ws13-worker-exit-status, ws13-worker-N) for the reason. A bad
        bundle.tar.gz, an exhausted pip retry loop and unset
        WS13_BUCKET/WS13_QUEUE_URL/WS13_DB_DSN all land here.
      Namespace: WS13/Fleet
      MetricName: WorkerExitFailures
      Dimensions: [{Name: AutoScalingGroupName, Value: !Ref FleetName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # Nodes publish 0 on a clean drain, so missing data means no node has
      # finished lately, which is not a failure.
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # A dead-lettered document is a document that will never be indexed unless
  # someone requeues it (pipelines/ws13_enqueue.py). Silence here is exactly
  # how a corpus loses documents without anyone noticing.
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ws13-dlq-not-empty
      AlarmDescription: >-
        Documents are sitting in the WS13 dead-letter queue. No worker polls
        it; requeue them with pipelines/ws13_enqueue.py against the work
        queue once the underlying failure is understood.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !Ref DeadLetterQueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

Outputs:
  AsgName: {Value: !Ref Fleet}
  FleetModeInUse: {Value: !Ref FleetMode}
  # Kept as an output in both modes, so a deploy that flipped the mode reads
  # as a changed value rather than as a vanished output.
  BacklogScalingPolicyArn:
    Value: !If [IsOcrMode, !Ref BacklogScaling, 'none: FleetMode=confidence']
  IdleFleetAlarmName: {Value: !Ref IdleFleetAlarm}
  WorkerFailureAlarmName: {Value: !Ref WorkerFailureAlarm}
  DeadLetterAlarmName: {Value: !Ref DeadLetterAlarm}
