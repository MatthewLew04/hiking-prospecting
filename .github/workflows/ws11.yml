name: WS11 national quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ws11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-and-progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: nw-mineral-monitor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nw-mineral-monitor/ci/requirements.txt
      - name: Verify materialized Git LFS assets
        run: |
          git lfs version
          git lfs pull
          git lfs fsck --objects --pointers
          python3 ci/verify_lfs.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: nw-mineral-monitor/package-lock.json
      - name: Install strict unit-test runtime
        run: 'python3 -m pip install --disable-pip-version-check --only-binary=:all: -r ci/requirements.txt'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install pinned Tippecanoe and COG validator
        run: bash ci/install_tippecanoe.sh
      - name: Verify native and Python test dependencies
        run: python3 ci/verify_runtime.py
      - run: python3 pipelines/state_registry.py validate
      - run: python3 ci/run_tests.py
      - run: python3 pipelines/reconcile_manifest.py --check
      - run: python3 pipelines/build_coverage.py --check
      - run: python3 pipelines/validate_national.py --profile progress
      - run: python3 pipelines/validate_quad_geology.py --skip-assets
      - run: >-
          python3 pipelines/validate_doc_store.py
          --manifest tests/fixtures/ws12_document_store_manifest.json
      - run: npm run test:browser
      - run: npm run test:ask-routing
      - run: npm run test:mine-documents

  release-gate:
    if: startsWith(github.ref, 'refs/tags/ws11-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: nw-mineral-monitor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify materialized Git LFS assets
        run: |
          git lfs version
          git lfs pull
          git lfs fsck --objects --pointers
          python3 ci/verify_lfs.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nw-mineral-monitor/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install COG validator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin
          gdalinfo --version
      - run: python3 pipelines/validate_national.py --profile release --require-all
      - run: npm run test:browser
