AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NW Mineral Monitor - static map site on S3 + CloudFront, with a nightly
  Lambda that refreshes BLM mining-claim snapshots (active daily; closed
  monthly in three batches).

Parameters:
  ProjectName:
    Type: String
    Default: nw-mineral-monitor
    AllowedPattern: '[a-z0-9-]+'
    Description: Lowercase name used to tag/derive resource names.
  AlertEmailFrom:
    Type: String
    Default: ''
    Description: >-
      SES-verified sender for expiration-watch digests (empty = email off).
      Verify the address in SES first — see RUNBOOK.md step 6.
  AlertEmailTo:
    Type: String
    Default: ''
    Description: Comma-separated recipient list for watch digests (empty = email off).
  AlertWebhookUrl:
    Type: String
    Default: ''
    Description: Optional webhook POSTed the alert digest JSON (empty = off).
  WatchBbox:
    Type: String
    Default: '-114.2867,41.9882,-113.0,42.6878'
    Description: AOI bbox (x0,y0,x1,y1) the expiration watch diffs. Default = Cassia County, ID.

Resources:

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ProjectName}-data-15min'
        DefaultTTL: 900
        MaxTTL: 3600
        MinTTL: 60
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref ProjectName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed policy "CachingOptimized"
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: 'data/*'
            TargetOriginId: site-s3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref DataCachePolicy

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  UpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: s3-data-rw
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject, s3:PutObject ]
                Resource: !Sub '${SiteBucket.Arn}/data/*'
              # checkpoint files for the resumable pulls (crash fix 2026-08-06)
              - Effect: Allow
                Action: [ s3:GetObject, s3:PutObject, s3:DeleteObject ]
                Resource: !Sub '${SiteBucket.Arn}/ckpt/*'
              # self-continuation: a pull that runs low on time re-invokes itself
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-claims-updater'

  UpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-claims-updater'
      Runtime: python3.12
      Handler: index.handler
      # 512 OOM-killed the NV pull (275k geometries in flight) and starved the
      # CPU — memory scales CPU/network on Lambda, so 2048 also parses ~4× faster
      MemorySize: 2048
      Timeout: 900
      Role: !GetAtt UpdaterRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
      Code:
        ZipFile: |
          def handler(event, context):
              return {"note": "placeholder - upload infra/lambda_updater.py "
                              "(deploy.sh step 3, or paste it in the Lambda "
                              "console code editor as index.py and Deploy)"}

  NightlyActiveRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-nightly-active'
      Description: Refresh active-claim snapshots, NW five states (09:10 UTC)
      ScheduleExpression: cron(10 9 * * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"active","states":["WA","OR","ID","MT","WY"]}'

  NightlyActiveNvUtRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-nightly-active-nvut'
      Description: Refresh active-claim snapshots, NV+UT (09:40 UTC — NV is slow, runs alone)
      ScheduleExpression: cron(40 9 * * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"active","states":["NV","UT"]}'

  MonthlyClosedRule1:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-1'
      Description: Refresh closed-claim snapshots for WA+OR (1st of month)
      ScheduleExpression: cron(0 10 1 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["WA","OR"]}'

  MonthlyClosedRule2:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-2'
      Description: Refresh closed-claim snapshots for ID+MT (1st of month)
      ScheduleExpression: cron(30 10 1 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["ID","MT"]}'

  MonthlyClosedRule3:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-3'
      Description: Refresh closed-claim snapshots for WY (1st of month)
      ScheduleExpression: cron(0 11 1 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["WY"]}'

  MonthlyClosedRule4:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-4'
      Description: Refresh closed-claim snapshot for NV (2nd of month — 1.23M cases, newest 250k kept)
      ScheduleExpression: cron(0 10 2 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["NV"]}'

  MonthlyClosedRule5:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-monthly-closed-5'
      Description: Refresh closed-claim snapshot for UT (2nd of month — 452k cases, newest 250k kept)
      ScheduleExpression: cron(0 11 2 * ? *)
      State: ENABLED
      Targets:
        - Id: updater
          Arn: !GetAtt UpdaterFunction.Arn
          Input: '{"mode":"closed","states":["UT"]}'

  PermNightly:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyActiveRule.Arn
  PermNightlyNvUt:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyActiveNvUtRule.Arn
  PermClosed1:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule1.Arn
  PermClosed2:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule2.Arn
  PermClosed3:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule3.Arn
  PermClosed4:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule4.Arn
  PermClosed5:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyClosedRule5.Arn

  # ---------- WS2d expiration watch ----------
  WatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: watch-s3-ses
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject, s3:PutObject ]
                Resource:
                  - !Sub '${SiteBucket.Arn}/data/*'
                  - !Sub '${SiteBucket.Arn}/watch/*'
              - Effect: Allow
                Action: [ ses:SendEmail ]
                Resource: '*'

  WatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-expiration-watch'
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 1024
      Timeout: 900
      Role: !GetAtt WatchRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          AOI_BBOX: !Ref WatchBbox
          SES_FROM: !Ref AlertEmailFrom
          SES_TO: !Ref AlertEmailTo
          WEBHOOK_URL: !Ref AlertWebhookUrl
          SITE_URL: !Sub 'https://${Distribution.DomainName}'
      Code:
        ZipFile: |
          def handler(event, context):
              return {"note": "placeholder - deploy.sh uploads infra/watch_lambda.py"}

  WatchDailyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-watch-daily'
      Description: Daily MLRS disposition diff for the AOI (13:10 UTC)
      ScheduleExpression: cron(10 13 * * ? *)
      State: ENABLED
      Targets:
        - Id: watch
          Arn: !GetAtt WatchFunction.Arn
          Input: '{"mode":"daily"}'

  # Sept-1 maintenance-fee window: every 6 h from Aug 25 through Sep 10.
  # EventBridge cron can't span a month boundary in one expression — two rules.
  WatchSeasonalAugRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-watch-fee-window-aug'
      Description: Fee-window watch, every 6h Aug 25-31
      ScheduleExpression: cron(20 */6 25-31 8 ? *)
      State: ENABLED
      Targets:
        - Id: watch
          Arn: !GetAtt WatchFunction.Arn
          Input: '{"mode":"seasonal"}'

  WatchSeasonalSepRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-watch-fee-window-sep'
      Description: Fee-window watch, every 6h Sep 1-10
      ScheduleExpression: cron(20 */6 1-10 9 ? *)
      State: ENABLED
      Targets:
        - Id: watch
          Arn: !GetAtt WatchFunction.Arn
          Input: '{"mode":"seasonal"}'

  PermWatchDaily:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WatchFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WatchDailyRule.Arn
  PermWatchAug:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WatchFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WatchSeasonalAugRule.Arn
  PermWatchSep:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WatchFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WatchSeasonalSepRule.Arn

  # ---------- AI Q&A (Bedrock relay) ----------
  AskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ bedrock:InvokeModel ]
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'

  AskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-ask'
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt AskRole.Arn
      Environment:
        Variables:
          # tried in order; first one that answers sticks. Override to force a model.
          # Verified against Bedrock model cards 2026-07: Opus 4.7 = best on Bedrock;
          # Nova 2 Lite = first-party floor that needs no Anthropic use-case form.
          MODEL_IDS: 'us.anthropic.claude-opus-4-7,us.anthropic.claude-sonnet-4-6,us.anthropic.claude-haiku-4-5-20251001-v1:0,us.amazon.nova-2-lite-v1:0'
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 501, "body": "placeholder - upload infra/ask_lambda.py"}

  # API Gateway HTTP API instead of a Function URL — some org guardrails (SCPs)
  # block anonymous lambda:InvokeFunctionUrl; API Gateway invokes are not affected.
  AskApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-ask-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [ '*' ]
        AllowMethods: [ POST, OPTIONS ]
        AllowHeaders: [ x-auth-token, content-type ]

  AskIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AskApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AskFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  AskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AskApi
      RouteKey: 'POST /ask'
      Target: !Sub 'integrations/${AskIntegration}'

  AskStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AskApi
      StageName: '$default'
      AutoDeploy: true

  AskApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AskFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AskApi}/*'

  # ---------- Cognito login ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true      # no self-signup
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 24
      IdTokenValidity: 24
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  MapUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: codyClinger
      MessageAction: SUPPRESS   # no invite email; deploy.sh sets the permanent password

Outputs:
  SiteURL:
    Description: Your map's URL
    Value: !Sub 'https://${Distribution.DomainName}'
  BucketName:
    Description: Upload the site/ folder here
    Value: !Ref SiteBucket
  UpdaterFunctionName:
    Description: The claims-updater Lambda
    Value: !Ref UpdaterFunction
  UserPoolId:
    Description: Cognito user pool (manage users here)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id (goes in auth.json)
    Value: !Ref UserPoolClient
  DistributionId:
    Description: CloudFront distribution (for cache invalidations)
    Value: !Ref Distribution
  AskUrl:
    Description: AI answerer endpoint (goes in auth.json)
    Value: !Sub 'https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/ask'
  AskFunctionName:
    Description: The AI relay Lambda
    Value: !Ref AskFunction
  WatchFunctionName:
    Description: The expiration-watch Lambda
    Value: !Ref WatchFunction
